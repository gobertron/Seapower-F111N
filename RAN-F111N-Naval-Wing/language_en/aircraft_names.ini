DefaultDescription=F-111N WaterPig, 1980. Block I: naval programme. Alternate-history Australian Naval Wing. Australia retains fixed-wing carrier aviation and funds a joint RAN-RAAF programme to protect its task groups far from shore. WaterPig develops the naval fleet-interceptor concept into a heavy fighter, exchanging the strike family's broad stores inventory for an outer air-defence screen and sustained combat air patrols. This block searches for air targets, with a 130-degree forward sector covering 65 degrees left and 65 degrees right of the nose. Radar detections remain local to the aircraft. Detection still depends on target size, altitude, aspect and jamming. Selectable armament includes AIM-9L Sidewinder, AIM-7F Sparrow, AIM-54A Phoenix and an M61 Vulcan with 2,000 rounds. Long-range patrol fits exchange wing stores for external fuel tanks. Phoenix has a separate targeting controller, and the fighter radar does not provide surface search. Power comes from the programme's TF30-P-109 reference, configured for 82.3 kN per engine in afterburner. The common maximum is Mach 2.875. Configured empty mass is 25,250 kg, with 14,897 kg internal fuel before external tanks. Naval engineering and upgrade performance are fictional programme estimates.
